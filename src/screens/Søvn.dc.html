<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block" rel="stylesheet">
<style>
html,body{margin:0;background:#232323;color:#fafafa;font-family:'Space Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#fafafa}a:hover{color:rgb(173 153 230)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;line-height:1;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;user-select:none}
</style>
</helmet>
<div style="box-sizing:border-box;width:100%;max-width:420px;min-height:100vh;margin:0 auto;background:#232323;padding:20px 18px 40px;display:flex;flex-direction:column;gap:22px">
  <header style="display:flex;align-items:center;justify-content:space-between">
    <div style="font-size:13px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:#7f7f7f">Søvn</div>
    <button style="width:36px;height:36px;border-radius:18px;background:#3a3a3a;display:grid;place-items:center"><span class="ms" style="font-size:20px">close</span></button>
  </header>

  <section style="display:flex;flex-direction:column;align-items:center;gap:18px">
    <div style="position:relative;width:200px;height:200px">
      <sc-for list="{{ ring }}" as="r" hint-placeholder-count="3"><div style="{{ r }}"></div></sc-for>
      <div style="position:absolute;inset:26px;border-radius:50%;background:#2f2f2f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
        <span class="ms" style="{{ coreIcon }}">{{ coreIconName }}</span>
        <div style="font-size:30px;font-weight:500;letter-spacing:-0.03em;font-variant-numeric:tabular-nums">{{ asleep }}<span style="font-size:15px;color:#7f7f7f;font-weight:400"> / {{ total }}</span></div>
        <div style="font-size:12px;color:#7f7f7f">sover</div>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center">
      <div style="font-size:24px;font-weight:500;letter-spacing:-0.015em">{{ headline }}</div>
      <div style="font-size:14px;color:#7f7f7f">{{ nextAlarm }}</div>
    </div>
  </section>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:4px;border-radius:20px;background:#2f2f2f">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="2"><button onClick="{{ t.go }}" style="{{ t.style }}">{{ t.label }}</button></sc-for>
  </div>

  <sc-if value="{{ isSleep }}" hint-placeholder-val="{{ true }}">
    <section style="display:flex;flex-direction:column">
      <sc-for list="{{ people }}" as="p" hint-placeholder-count="3">
        <button onClick="{{ p.toggle }}" style="{{ p.row }}">
          <span style="{{ p.iconWrap }}"><span class="ms" style="font-size:20px;font-variation-settings:'FILL' 1">{{ p.icon }}</span></span>
          <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;text-align:left">
            <span style="font-size:15px;font-weight:500;display:flex;align-items:center;gap:6px">{{ p.name }}<span style="{{ p.chip }}">{{ p.chipLabel }}</span></span>
            <span style="font-size:12px;color:#7f7f7f">{{ p.sub }}</span>
          </div>
          <span style="{{ p.track }}"><span style="{{ p.knob }}"></span></span>
        </button>
      </sc-for>
    </section>
    <section style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;justify-content:space-between;padding:0 4px">
        <div style="font-size:12px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:#7f7f7f">Siste 24 timer</div>
        <div style="font-size:12px;color:#696969">hvem sov når</div>
      </div>
      <sc-for list="{{ timeline }}" as="t" hint-placeholder-count="3">
        <div style="display:flex;align-items:center;gap:10px">
          <span style="width:70px;font-size:12px;color:#979797">{{ t.name }}</span>
          <div style="position:relative;flex:1;height:16px;border-radius:8px;background:#2f2f2f;overflow:hidden">
            <sc-for list="{{ t.segs }}" as="g" hint-placeholder-count="1"><span style="{{ g }}"></span></sc-for>
          </div>
        </div>
      </sc-for>
      <div style="display:flex;justify-content:space-between;padding-left:80px;font-size:10px;color:#696969;font-variant-numeric:tabular-nums"><sc-for list="{{ axis }}" as="x" hint-placeholder-count="5"><span>{{ x }}</span></sc-for></div>
    </section>
  </sc-if>

  <sc-if value="{{ isWake }}" hint-placeholder-val="{{ false }}">
    <section style="display:flex;flex-direction:column;gap:8px">
      <sc-for list="{{ alarms }}" as="w" hint-placeholder-count="3">
        <div style="{{ w.card }}">
          <div style="display:flex;align-items:center;gap:12px">
            <div style="flex:1;display:flex;flex-direction:column;gap:2px">
              <span style="font-size:13px;color:#7f7f7f">{{ w.name }}</span>
              <div style="display:flex;align-items:center;gap:6px">
                <button onClick="{{ w.dec }}" style="width:32px;height:32px;border-radius:16px;background:#3a3a3a;display:grid;place-items:center"><span class="ms" style="font-size:18px">remove</span></button>
                <span style="font-size:34px;font-weight:300;letter-spacing:-0.03em;font-variant-numeric:tabular-nums;min-width:96px;text-align:center">{{ w.time }}</span>
                <button onClick="{{ w.inc }}" style="width:32px;height:32px;border-radius:16px;background:#3a3a3a;display:grid;place-items:center"><span class="ms" style="font-size:18px">add</span></button>
              </div>
            </div>
            <button onClick="{{ w.toggle }}" style="{{ w.track }}"><span style="{{ w.knob }}"></span></button>
          </div>
          <div style="display:flex;gap:4px">
            <sc-for list="{{ w.days }}" as="d" hint-placeholder-count="7"><button onClick="{{ d.go }}" style="{{ d.style }}">{{ d.l }}</button></sc-for>
          </div>
          <span style="font-size:12px;color:#7f7f7f">{{ w.sub }}</span>
        </div>
      </sc-for>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:1000}}">
const MOON = 'rgb(173 153 230)', SUN = 'rgb(242 181 115)';

// ── Live-kobling: KI Søvn (ki_sovn) + KI Vekking (ki_sovn vekking / ki_vekking) ─────
// Personer: binary_sensor.<navn>_sovn_sover (integrasjon: ki_sovn, type: person).
// Vekking: sensor.<navn>_vekking_neste_alarm (+ switch/time per ukedag). ki_sovn har ingen søvnscore/faser –

const DAY_IDX = { Mandag: 0, Tirsdag: 1, Onsdag: 2, Torsdag: 3, Fredag: 4, 'Lørdag': 5, 'Søndag': 6 };
const toMin = t => { const m = /^(\d{1,2}):(\d{2})/.exec(String(t || '')); return m ? +m[1] * 60 + +m[2] : null; };
const clock = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const prefixOf = (id, attr, suffix) => attr || id.split('.')[1].replace(new RegExp(suffix + '$'), '');
function sleepSegs(probId, thr, from, to, asleepNow, since) {

    let start = null;

  if (!pIds.length && !aIds.length) return null;

    const thr = ha.num(`number.${pre}_terskel`, 80);
    const since = A['siden'] ? new Date(A['siden']) : ha.changed(id);
    const segs = sleepSegs(`sensor.${pre}_sannsynlighet`, thr, from, now, asleep, since);
    return { id, pre, name: A.navn || ha.name(id, id), asleep, window: A['obs_vindu_åpent'] === true, since, segs,
      prob: A.sannsynlighet ?? ha.num(`sensor.${pre}_sannsynlighet`, null),
      btnOn: ha.first(null, `button.${pre}_sett_sover`), btnOff: ha.first(null, `button.${pre}_sett_vaken`) };
  });

  const alarms = aIds.map(id => {
    const st = ha.state(id), A = st.attributes || {}, pre = prefixOf(id, A.prefix, '_neste_alarm');
    const dayIdx = A.neste_dag != null && DAY_IDX[A.neste_dag] != null ? DAY_IDX[A.neste_dag] : today;
    const tId = `time.${pre}_${DAY_KEYS[dayIdx]}`;
    const t = toMin(ha.val(tId)) ?? toMin(st.state);
    const days = DAY_KEYS.map(d => ({ sw: `switch.${pre}_${d}_aktiv`, tid: `time.${pre}_${d}`, on: ha.on(`switch.${pre}_${d}_aktiv`, false), t: toMin(ha.val(`time.${pre}_${d}`)) }));

    { name: 'Rune', asleep: false, window: false, night: [[22.8, 7.8]], alarm: 420, on: true, days: [1,1,1,1,1,1,1], light: false },
    { name: 'Sebastian', asleep: false, window: false, night: [[23.6, 7.2], [15.5, 0.6]], alarm: 435, on: false, days: [1,1,1,1,1,0,0], light: true },

      tabs: [['sleep', 'Søvn'], ['wake', 'Vekking']].map(([k, label]) => ({ label, go: () => this.setState({ tab: k }), style: { height: 40, borderRadius: 16, fontSize: 13, fontWeight: 500, background: s.tab === k ? PINK : 'transparent', color: s.tab === k ? '#2a1720' : '#979797' } })),
      isSleep: s.tab === 'sleep', isWake: s.tab === 'wake',
      people: s.people.map((p, i) => { const w = sw(p.asleep); return { name: p.name, icon: p.asleep ? 'bedtime' : 'light_mode', track: w.track, knob: w.knob,
        sub: p.asleep ? 'Sover · lys dimmet, varsler av' : `Våken · sov ${Math.floor(p.night[0][1])} t ${Math.round((p.night[0][1] % 1) * 60)} min i natt`,
        chipLabel: p.window ? 'Vindu åpent' : '', chip: { display: p.window ? 'inline-flex' : 'none', fontSize: 10, fontWeight: 600, padding: '2px 7px', borderRadius: 7, background: a('rgb(115 185 242)', 0.18), color: 'rgb(115 185 242)' },
        toggle: () => this.upd(i, x => ({ asleep: !x.asleep })),
        row: { display: 'flex', alignItems: 'center', gap: 12, padding: '12px 4px', width: '100%', borderTop: i ? '1px solid rgba(255,255,255,0.05)' : 'none' },
        iconWrap: { width: 42, height: 42, borderRadius: 21, flex: 'none', display: 'grid', placeItems: 'center', background: a(p.asleep ? MOON : SUN, 0.18), color: p.asleep ? MOON : SUN, transition: 'background .3s' } }; }),
      timeline: s.people.map(p => ({ name: p.name, segs: p.night.map(([start, dur]) => { const off = ((start - 21 + 24) % 24) / 24 * 100; return { position: 'absolute', top: 0, bottom: 0, left: `${off}%`, width: `${dur / 24 * 100}%`, borderRadius: 8, background: MOON }; }) })),
      alarms: s.people.map((p, i) => { const w = sw(p.on); return { name: p.name, time: hm(p.alarm), track: w.track, knob: w.knob,
        dec: () => this.upd(i, x => ({ alarm: (x.alarm - 15 + 1440) % 1440 })), inc: () => this.upd(i, x => ({ alarm: (x.alarm + 15) % 1440 })),
        toggle: () => this.upd(i, x => ({ on: !x.on })),

        card: { display: 'flex', flexDirection: 'column', gap: 12, padding: 16, borderRadius: 24, background: '#2f2f2f', opacity: p.on ? 1 : 0.55, transition: 'opacity .2s' },
        days: DAYS.map((l, k) => ({ l, go: () => this.upd(i, x => ({ days: x.days.map((v, m) => m === k ? 1 - v : v) })), style: { flex: 1, height: 32, borderRadius: 16, fontSize: 12, fontWeight: 600, background: p.days[k] ? a(MOON, 0.9) : '#3a3a3a', color: p.days[k] ? '#232323' : '#7f7f7f' } })) }; }),

      isSleep: s.tab === 'sleep', isWake: s.tab === 'wake',
      people: P.map((p, i) => { const w = sw(p.asleep);

        return { name: p.name, icon: p.asleep ? 'bedtime' : 'light_mode', track: w.track, knob: w.knob, sub,
          chipLabel: p.window ? 'Vindu åpent' : '', chip: { display: p.window ? 'inline-flex' : 'none', fontSize: 10, fontWeight: 600, padding: '2px 7px', borderRadius: 7, background: a('rgb(115 185 242)', 0.18), color: 'rgb(115 185 242)' },
          toggle: () => { const b = p.asleep ? p.btnOff : p.btnOn; return b ? ha.press(b) : ha.moreInfo(p.id); },
          row: { display: 'flex', alignItems: 'center', gap: 12, padding: '12px 4px', width: '100%', borderTop: i ? '1px solid rgba(255,255,255,0.05)' : 'none' },
          iconWrap: { width: 42, height: 42, borderRadius: 21, flex: 'none', display: 'grid', placeItems: 'center', background: a(p.asleep ? MOON : SUN, 0.18), color: p.asleep ? MOON : SUN, transition: 'background .3s' } }; }),
      timeline: P.map(p => ({ name: p.name, segs: p.segs.map(([x, y]) => ({ position: 'absolute', top: 0, bottom: 0, left: `${(x - L.from) / span * 100}%`, width: `${Math.max(0.5, (y - x) / span * 100)}%`, borderRadius: 8, background: MOON })) })),

          sub: bits.length ? bits.join(' · ') : 'Vekkelys',
          card: { display: 'flex', flexDirection: 'column', gap: 12, padding: 16, borderRadius: 24, background: '#2f2f2f', opacity: w.on ? 1 : 0.55, transition: 'opacity .2s' },
          days: DAYS.map((l, k) => { const d = w.days[k]; return { l, go: () => ha.toggle(d.sw), style: { flex: 1, height: 32, borderRadius: 16, fontSize: 12, fontWeight: 600, background: d.on ? a(MOON, 0.9) : '#3a3a3a', color: d.on ? '#232323' : '#7f7f7f', boxShadow: k === w.dayIdx && w.on ? `inset 0 0 0 1.5px ${MOON}` : 'none' } }; }) }; }),
    };
  }
}
</script>
