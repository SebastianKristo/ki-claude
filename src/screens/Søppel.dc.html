<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block" rel="stylesheet">
<style>
html,body{margin:0;background:#232323;color:#fafafa;font-family:'Space Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#fafafa}a:hover{color:rgb(242 133 201)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;line-height:1;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;user-select:none}
</style>
</helmet>
<div style="box-sizing:border-box;width:100%;max-width:420px;margin:0 auto;background:{{ rootBg }};padding:{{ rootPad }};display:flex;flex-direction:column;gap:16px">
  <sc-if value="{{ notEdOnly }}" hint-placeholder-val="{{ true }}"><header style="display:flex;align-items:center;gap:12px">
    <span style="width:40px;height:40px;border-radius:20px;background:#e1e1e1;color:#232323;display:grid;place-items:center;flex:none"><span class="ms" style="font-size:22px;font-variation-settings:'FILL' 1">delete</span></span>
    <div style="flex:1;font-size:26px;font-weight:500;letter-spacing:-0.02em">Søppel</div>
    <button onClick="{{ edToggle }}" title="Rediger" style="{{ edBtn }}"><span class="ms" style="font-size:20px">tune</span></button>
  </header></sc-if>
  <sc-if value="{{ edOpen }}" hint-placeholder-val="{{ false }}">
    <section style="display:flex;flex-direction:column;gap:14px;padding:16px;border-radius:26px;background:#2f2f2f">
      <span style="font-size:12px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:#7f7f7f;padding:0 4px">Fraksjoner og sensorer</span>
      <sc-for list="{{ edFr }}" as="f" hint-placeholder-count="4">
        <div style="display:flex;flex-direction:column;gap:12px;padding:8px 8px 8px 10px;border-radius:20px;background:#3a3a3a">
          <div style="display:flex;align-items:center;gap:10px">
            <span style="{{ f.dot }}"><span class="ms" style="font-size:20px;font-variation-settings:'FILL' 1">{{ f.icon }}</span></span>
            <button onClick="{{ f.toggle }}" style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left"><span style="font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ f.name }}</span><span style="font-size:11px;color:#979797;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ f.entity }}</span></button>
            <button onClick="{{ f.up }}" title="Flytt opp" style="{{ f.upStyle }}"><span class="ms" style="font-size:20px">keyboard_arrow_up</span></button>
            <button onClick="{{ f.down }}" title="Flytt ned" style="{{ f.downStyle }}"><span class="ms" style="font-size:20px">keyboard_arrow_down</span></button>
            <button onClick="{{ f.toggle }}" title="Rediger" style="width:34px;height:34px;border-radius:17px;display:grid;place-items:center;flex:none;color:#c7c7c7"><span class="ms" style="{{ f.chev }}">expand_more</span></button>
          </div>
          <sc-if value="{{ f.open }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex;flex-direction:column;gap:12px;padding:0 2px 4px">
              <label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:12px;color:#979797;padding-left:4px">Navn</span><input value="{{ f.name }}" onChange="{{ f.setName }}" style="box-sizing:border-box;width:100%;height:44px;border-radius:14px;border:0;outline:none;background:#232323;color:#fafafa;padding:0 14px;font:inherit;font-size:14px"></label>
              <label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:12px;color:#979797;padding-left:4px">Sensor</span><input value="{{ f.entityRaw }}" onChange="{{ f.setEntity }}" placeholder="sensor.min_renovasjon_…" spellcheck="false" style="box-sizing:border-box;width:100%;height:44px;border-radius:14px;border:0;outline:none;background:#232323;color:#fafafa;padding:0 14px;font:inherit;font-size:14px"></label>
              <div style="display:flex;flex-direction:column;gap:6px"><span style="font-size:12px;color:#979797;padding-left:4px">Intervall</span><div style="display:flex;gap:2px;padding:3px;border-radius:17px;background:#232323"><sc-for list="{{ f.steps }}" as="o" hint-placeholder-count="4"><button onClick="{{ o.go }}" style="{{ o.style }}">{{ o.label }}</button></sc-for></div></div>
              <div style="display:flex;flex-direction:column;gap:6px"><span style="font-size:12px;color:#979797;padding-left:4px">Ikon</span><div style="display:flex;gap:6px;flex-wrap:wrap"><sc-for list="{{ f.icons }}" as="o" hint-placeholder-count="8"><button onClick="{{ o.go }}" style="{{ o.style }}"><span class="ms" style="font-size:20px;font-variation-settings:'FILL' 1">{{ o.icon }}</span></button></sc-for></div></div>
              <div style="display:flex;flex-direction:column;gap:6px"><span style="font-size:12px;color:#979797;padding-left:4px">Farge</span><div style="display:flex;gap:8px;flex-wrap:wrap"><sc-for list="{{ f.cols }}" as="o" hint-placeholder-count="7"><button onClick="{{ o.go }}" style="{{ o.style }}"></button></sc-for></div></div>
              <sc-if value="{{ f.canDel }}" hint-placeholder-val="{{ true }}"><button onClick="{{ f.del }}" style="height:42px;border-radius:21px;background:rgb(242 128 115 / 0.14);color:rgb(242 128 115);display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:500"><span class="ms" style="font-size:18px">delete</span>Fjern fraksjon</button></sc-if>
            </div>
          </sc-if>
        </div>
      </sc-for>
      <button onClick="{{ addFr }}" style="height:46px;border-radius:23px;box-shadow:inset 0 0 0 1.5px #3a3a3a;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:500;color:#c7c7c7"><span class="ms" style="font-size:20px">add</span>Legg til fraksjon</button>
      <span style="font-size:12px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:#7f7f7f;padding:0 4px;padding-top:4px">Oppsett</span>
      <div style="display:flex;flex-direction:column;border-radius:20px;background:#3a3a3a;padding:2px 14px">
          <sc-for list="{{ edToggles }}" as="t" hint-placeholder-count="3"><button onClick="{{ t.go }}" style="display:flex;align-items:center;gap:12px;min-height:56px;width:100%;text-align:left;border-top:{{ t.bt }}"><span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;font-weight:500">{{ t.label }}</span><sc-if value="{{ t.hasSub }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;color:#979797">{{ t.sub }}</span></sc-if></span><span style="{{ t.track }}"><span style="{{ t.knob }}"></span></span></button></sc-for>
        </div>
        <sc-for list="{{ edSegs }}" as="g" hint-placeholder-count="1"><div style="display:flex;align-items:center;gap:12px"><span style="flex:1;font-size:14px;font-weight:500;padding-left:4px">{{ g.title }}</span><div style="display:flex;gap:2px;padding:3px;border-radius:17px;background:#3a3a3a;min-width:170px"><sc-for list="{{ g.opts }}" as="o" hint-placeholder-count="2"><button onClick="{{ o.go }}" style="{{ o.style }}">{{ o.label }}</button></sc-for></div></div></sc-for>
        <sc-if value="{{ showDone }}" hint-placeholder-val="{{ true }}"><button onClick="{{ edClose }}" style="height:48px;border-radius:24px;background:linear-gradient(145deg, rgb(242 133 201) -10%, rgb(245 205 198) 100%);color:#5a3a48;font-size:15px;font-weight:600">Ferdig</button></sc-if>
    </section>
  </sc-if>

  <sc-if value="{{ notEdOnly }}" hint-placeholder-val="{{ true }}"><section style="position:relative;overflow:hidden;display:flex;gap:14px;padding:18px;border-radius:26px;background:#2f2f2f;min-height:170px">
    <span style="width:44px;height:44px;border-radius:22px;background:#3a3a3a;display:grid;place-items:center;flex:none"><span class="ms" style="{{ heroIcon }}">{{ hero.icon }}</span></span>
    <div style="display:flex;flex-direction:column;gap:4px;position:relative;z-index:1">
      <span style="font-size:12px;color:#7f7f7f">Neste tømming</span>
      <span style="font-size:16px;font-weight:600">{{ hero.names }}</span>
      <span style="font-size:44px;font-weight:500;letter-spacing:-0.03em;line-height:1.05;font-variant-numeric:tabular-nums">{{ hero.days }}<span style="font-size:16px;color:#7f7f7f;font-weight:400;letter-spacing:0"> {{ hero.unit }}</span></span>
      <span style="font-size:13px;color:#7f7f7f">{{ hero.date }}</span>
    </div>
    <span class="ms" style="position:absolute;right:-6px;bottom:-18px;font-size:130px;color:#2f2f2f;font-variation-settings:'FILL' 1">delete</span>
    <span style="position:absolute;left:0;right:0;bottom:0;height:4px;background:#3a3a3a"><span style="{{ heroBar }}"></span></span>
  </section>

  <sc-if value="{{ showTabs }}" hint-placeholder-val="{{ true }}"><div style="display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:4px;border-radius:22px;background:#2f2f2f">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="2"><button onClick="{{ t.go }}" style="{{ t.style }}"><span class="ms" style="font-size:20px">{{ t.icon }}</span>{{ t.label }}</button></sc-for>
  </div></sc-if>

  <sc-if value="{{ isList }}" hint-placeholder-val="{{ true }}">
    <section style="display:flex;flex-direction:column;gap:8px">
      <sc-for list="{{ fractions }}" as="f" hint-placeholder-count="4">
        <button onClick="{{ f.toggle }}" style="{{ f.card }}">
          <span style="display:flex;align-items:center;gap:14px;width:100%">
            <span style="{{ f.iconWrap }}"><span class="ms" style="font-size:24px;font-variation-settings:'FILL' 1">{{ f.icon }}</span></span>
            <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;text-align:left">
              <span style="font-size:15px;font-weight:500">{{ f.name }}</span>
              <span style="font-size:13px;color:#7f7f7f">{{ f.date }}</span>
            </span>
            <span style="font-size:24px;font-weight:500;font-variant-numeric:tabular-nums">{{ f.days }}<span style="font-size:12px;color:#7f7f7f;font-weight:400"> {{ f.unit }}</span></span>
          </span>
          <sc-if value="{{ f.open }}" hint-placeholder-val="{{ false }}">
            <span style="display:flex;flex-direction:column;gap:10px;width:100%;padding-top:12px;border-top:1px solid rgba(255,255,255,0.06);text-align:left">
              <span style="font-size:12px;color:#7f7f7f">{{ f.every }}</span>
              <span style="display:flex;gap:6px;flex-wrap:wrap">
                <sc-for list="{{ f.upcoming }}" as="u" hint-placeholder-count="4"><span style="height:28px;padding:0 10px;border-radius:14px;background:#3a3a3a;display:flex;align-items:center;font-size:12px;white-space:nowrap">{{ u }}</span></sc-for>
              </span>
            </span>
          </sc-if>
        </button>
      </sc-for>
    </section>
    <sc-if value="{{ showNotify }}" hint-placeholder-val="{{ true }}"><button onClick="{{ toggleNotify }}" style="display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:22px;background:#2f2f2f;text-align:left">
      <span class="ms" style="font-size:22px;color:#7f7f7f">notifications</span>
      <span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;font-weight:500">Varsle kvelden før</span><span style="font-size:12px;color:#7f7f7f">Kl. 19:00 til alle i huset</span></span>
      <span style="{{ notifyTrack }}"><span style="{{ notifyKnob }}"></span></span>
    </button></sc-if>
  </sc-if>

  <sc-if value="{{ isCal }}" hint-placeholder-val="{{ false }}">
    <section style="display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:24px;background:#2f2f2f">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <button onClick="{{ prev }}" style="width:36px;height:36px;border-radius:18px;background:#3a3a3a;display:grid;place-items:center"><span class="ms" style="font-size:22px">chevron_left</span></button>
        <span style="font-size:15px;font-weight:500">{{ monthLabel }}</span>
        <button onClick="{{ next }}" style="width:36px;height:36px;border-radius:18px;background:#3a3a3a;display:grid;place-items:center"><span class="ms" style="font-size:22px">chevron_right</span></button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">
        <sc-for list="{{ wd }}" as="w" hint-placeholder-count="7"><div style="text-align:center;font-size:11px;color:#696969;padding-bottom:4px">{{ w }}</div></sc-for>
        <sc-for list="{{ cells }}" as="c" hint-placeholder-count="42">
          <div style="{{ c.style }}">
            <span style="{{ c.num }}">{{ c.n }}</span>
            <span style="display:flex;gap:3px;height:6px"><sc-for list="{{ c.dots }}" as="d" hint-placeholder-count="0"><span style="{{ d }}"></span></sc-for></span>
          </div>
        </sc-for>
      </div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;padding-top:4px">
        <sc-for list="{{ legend }}" as="l" hint-placeholder-count="4"><span style="display:flex;align-items:center;gap:6px;font-size:12px;color:#979797"><span style="{{ l.dot }}"></span>{{ l.name }}</span></sc-for>
      </div>
    </section>
  </sc-if></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:900}}">
const PINK = 'linear-gradient(145deg, rgb(242 133 201) -10%, rgb(245 205 198) 100%)';
const a = (c, o) => c.startsWith('#') ? c : c.replace(')', ` / ${o})`);
const DEMO_TODAY = new Date(2026, 8, 25);
let TODAY = DEMO_TODAY;
const F0 = [
  { id: 'rest', name: 'Restavfall', entity: 'sensor.min_renovasjon_restavfall', icon: 'delete', col: '#979797', start: '2026-09-28', step: 14 },
  { id: 'plast', name: 'Plastemballasje', entity: 'sensor.min_renovasjon_plastemballasje', icon: 'recycling', col: 'rgb(173 153 230)', start: '2026-09-28', step: 14 },
  { id: 'papir', name: 'Papir og papp', entity: 'sensor.min_renovasjon_papir', icon: 'newspaper', col: 'rgb(115 185 242)', start: '2026-10-01', step: 28 },
  { id: 'glass', name: 'Glass og metallemballasje', entity: 'sensor.min_renovasjon_glass_og_metallemballasje', icon: 'liquor', col: 'rgb(102 209 158)', start: '2026-10-01', step: 56 },
];
const DEF = { fr: F0, showTabs: true, showNotify: true, defTab: 'list', order: 'next' };
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const ICONS = ['delete', 'recycling', 'newspaper', 'liquor', 'compost', 'checkroom', 'battery_full', 'eco', 'inventory_2', 'yard'];
const COLS = ['#979797', 'rgb(173 153 230)', 'rgb(115 185 242)', 'rgb(102 209 158)', 'rgb(242 210 111)', 'rgb(242 181 115)', 'rgb(242 133 201)', 'rgb(242 128 115)'];
const tr = on => ({ track: { position: 'relative', width: 44, height: 26, borderRadius: 13, flex: 'none', background: on ? 'rgb(242 133 201)' : '#232323', transition: 'background .2s' }, knob: { position: 'absolute', top: 3, left: on ? 21 : 3, width: 20, height: 20, borderRadius: 10, background: '#fafafa', transition: 'left .2s' } });
const segBtn = on => ({ flex: 1, height: 36, borderRadius: 14, fontSize: 13, fontWeight: 500, whiteSpace: 'nowrap', background: on ? 'linear-gradient(145deg, rgb(242 133 201) -10%, rgb(245 205 198) 100%)' : 'transparent', color: on ? '#5a3a48' : '#afafaf' });
const DAY = 864e5;
const demoDates = f => Array.from({ length: 16 }, (_, i) => new Date(f.start.getTime() + (i - 4) * f.step * DAY));
// Live: real pickup dates when the fraction has them (f.live), else the fraction's own interval aligned around today.
const dates = f => {
  if (f.live) return f.live;
  if (TODAY === DEMO_TODAY) return demoDates(f);
  if (f.entity) return []; // live, but this fraction's sensor has no dates → not shown
  const k = Math.floor((TODAY - f.start) / (f.step * DAY));
  return Array.from({ length: 16 }, (_, i) => new Date(f.start.getTime() + (k + i - 4) * f.step * DAY));
};
// ── live helpers ──
const d0 = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
function parseDate(v) {
  if (v === null || v === undefined || v === '') return null;
  if (v instanceof Date) return isNaN(v) ? null : d0(v);
  if (typeof v === 'object') return parseDate(v.date || v.dato || v.dateTime || v.start);
  const t = String(v).trim();
  let m = /^(\d{4})-(\d{2})-(\d{2})/.exec(t); if (m) return new Date(+m[1], m[2] - 1, +m[3]);
  m = /^(\d{1,2})[./](\d{1,2})[./](\d{2,4})/.exec(t); if (m) return new Date(m[3].length === 2 ? 2000 + +m[3] : +m[3], m[2] - 1, +m[1]);
  return null;
}
const WASTE_ICONS = [[/rest/i, 'delete', '#979797'], [/plast/i, 'recycling', 'rgb(173 153 230)'], [/papir|papp/i, 'newspaper', 'rgb(115 185 242)'], [/glass|metall/i, 'liquor', 'rgb(102 209 158)'], [/mat|bio|kompost|organ/i, 'compost', 'rgb(242 210 111)'], [/tekstil|kl[æa]r/i, 'checkroom', 'rgb(242 181 115)'], [/farlig|batteri|el-?avfall/i, 'battery_full', 'rgb(242 128 115)'], [/hage/i, 'yard', 'rgb(102 209 158)']];
const styleOf = (name, i) => { const w = WASTE_ICONS.find(x => x[0].test(name)); return w ? { icon: w[1], col: w[2] } : { icon: 'delete', col: COLS[i % COLS.length] }; };
// Pickup dates for one fraction from its entity: calendar.* (events matching f.match/name), or a sensor
// (Min renovasjon / waste_collection_schedule: date state, date attributes, "upcoming" lists, days-to numbers).
function liveDates(f) {
  const id = f.entity; if (!id || !ha.live) return null;
  const st = ha.state(id); if (!st) return null;
  if (id.startsWith('calendar.')) {
    const evs = ha.events(id, 180); if (!evs) return [];
    const key = (f.match || f.name.split(/[\s,]/)[0] || '').toLowerCase();
    return evs.filter(e => !key || String(e.summary || '').toLowerCase().includes(key)).map(e => parseDate(e.start)).filter(Boolean);
  }
  const out = [], A = st.attributes || {}, today = d0(new Date());
  const add = v => { const d = parseDate(v); if (d) out.push(d); };
  ['next_date', 'next_pickup', 'neste_tomming', 'neste', 'date', 'dato', 'tommedato'].forEach(k => add(A[k]));
  ['upcoming', 'dates', 'datoer', 'kommende', 'pickups'].forEach(k => Array.isArray(A[k]) && A[k].forEach(add));
  Object.keys(A).forEach(k => { if (/^\d{4}-\d{2}-\d{2}$|^\d{1,2}\.\d{1,2}\.\d{4}$/.test(k)) add(k); });
  add(st.state);
  const n = parseFloat(st.state), unit = A.unit_of_measurement || '';
  if (!out.length && /^\d+$/.test(String(st.state)) && Number.isFinite(n) && n < 400 && (!unit || /^(d|days?|dager?)$/i.test(unit))) out.push(new Date(today.getTime() + n * DAY));
  if (!out.length && Number.isFinite(A.days_to ?? A.daysTo ?? A.dager)) out.push(new Date(today.getTime() + (A.days_to ?? A.daysTo ?? A.dager) * DAY));
  return [...new Map(out.map(d => [d.toDateString(), d])).values()].sort((x, y) => x - y);
}
// Fractions discovered from the waste integrations (used when neither the editor nor card config lists any that exist).
function autoFractions() {
  if (!ha.live) return null;
  const cal = ha.first('tommekalender');
  if (cal && cal.startsWith('calendar.')) {
    ha.state(cal);
    const names = [...new Set((ha.events(cal, 180) || []).map(e => String(e.summary || '').trim()).filter(Boolean))];
    if (names.length) return names.map((name, i) => ({ id: 'a' + i, name, entity: cal, match: name, ...styleOf(name, i), start: '2026-09-28', step: 14 }));
  }
  const ids = [...ha.all('min_renovasjon', 'sensor'), ...ha.all('waste_collection_schedule', 'sensor'), ...ha.all('renovasjonsportal', 'sensor')];
  if (!ids.length) return null;
  return ids.map((id, i) => { const name = ha.name(id, id.split('.')[1]).replace(/^(min renovasjon|renovasjon)\s*/i, '').replace(/^./, c => c.toUpperCase()); return { id: 'a' + i, name, entity: id, ...styleOf(name, i), start: '2026-09-28', step: 14 }; });
}
const nextOf = f => dates(f).find(d => d >= TODAY);
const diff = d => Math.round((d - TODAY) / DAY);
const fmt = d => d.toLocaleDateString('nb-NO', { weekday: 'long', day: 'numeric', month: 'long' }).replace(/^./, c => c.toUpperCase());
const short = d => d.toLocaleDateString('nb-NO', { weekday: 'short', day: 'numeric', month: 'short' });
const same = (x, y) => x.toDateString() === y.toDateString();
class Component extends DCLogic {
  state = { tab: null, open: null, notify: true, month: [2026, 8], ed: false, edSel: null };
  cfg() {
    if (this._c === undefined) { try { this._c = JSON.parse(localStorage.getItem('soppel-cfg') || 'null'); } catch (e) { this._c = null; } }
    const base = { ...DEF };
    const cf = Array.isArray(ha.config.fractions) && ha.config.fractions.length ? ha.config.fractions : null;
    if (cf) base.fr = cf.map((f, i) => ({ id: f.id || 'c' + i, name: f.name || ha.name(f.entity, 'Fraksjon ' + (i + 1)), entity: f.entity || '', match: f.match, ...styleOf(f.name || '', i), ...(f.icon ? { icon: f.icon } : {}), ...(f.col || f.color ? { col: f.col || f.color } : {}), start: f.start || '2026-09-28', step: f.step || 14 }));
    else if (ha.live && !F0.some(f => ha.state(f.entity))) { const auto = autoFractions(); if (auto) base.fr = auto; }
    return { ...base, ...(this.state.cfg || this._c || {}) };
  }
  setCfg(p) { const n = { ...this.cfg(), ...p }; try { localStorage.setItem('soppel-cfg', JSON.stringify(n)); } catch (e) {} this._c = n; this.setState({ cfg: n }); }
