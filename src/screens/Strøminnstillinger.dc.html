<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block" rel="stylesheet">
<style>
html,body{margin:0;background:#232323;color:#fafafa;font-family:'Space Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#fafafa}a:hover{color:rgb(242 133 201)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;line-height:1;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;user-select:none}
</style>
</helmet>
<div style="box-sizing:border-box;width:100%;max-width:420px;min-height:100vh;margin:0 auto;background:#232323;padding:20px 18px 40px;display:flex;flex-direction:column;gap:16px">
  <header style="display:flex;align-items:center;gap:12px">
    <span style="width:40px;height:40px;border-radius:20px;background:#e1e1e1;color:#232323;display:grid;place-items:center;flex:none"><span class="ms" style="font-size:22px;font-variation-settings:'FILL' 1">settings_power</span></span>
    <div style="flex:1;font-size:26px;font-weight:500;letter-spacing:-0.02em">Strøminnstillinger</div>
  </header>
  <section style="display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:26px;background:#2f2f2f">
    <span style="font-size:12px;color:#7f7f7f">Totalpris nå · inkl. nettleie, påslag og strømstøtte</span>
    <span style="font-size:44px;font-weight:500;letter-spacing:-0.03em;line-height:1.05;font-variant-numeric:tabular-nums">{{ total }}<span style="font-size:16px;color:#7f7f7f;font-weight:400"> kr/kWh</span></span>
    <div style="display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px"><sc-for list="{{ parts }}" as="p" hint-placeholder-count="4"><span style="{{ p.bar }}"></span></sc-for></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 12px"><sc-for list="{{ parts }}" as="p" hint-placeholder-count="4"><span style="display:flex;align-items:center;gap:6px;font-size:12px;color:#979797"><span style="{{ p.dot }}"></span><span style="flex:1">{{ p.label }}</span><span style="color:#fafafa;font-variant-numeric:tabular-nums">{{ p.val }}</span></span></sc-for></div>
  </section>
  <sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
    <span style="font-size:12px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:#7f7f7f;padding:4px 4px 0">{{ g.title }}</span>
    <section style="display:flex;flex-direction:column;padding:4px 10px 4px 16px;border-radius:24px;background:#2f2f2f">
      <sc-for list="{{ g.rows }}" as="r" hint-placeholder-count="3">
        <div style="{{ r.row }}">
          <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px"><span style="font-size:14px;font-weight:500">{{ r.label }}</span><span style="font-size:11px;color:#7f7f7f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.ent }}</span></span>
          <div style="display:flex;align-items:center;gap:2px;flex:none;padding:3px;border-radius:20px;background:#232323">
            <button onClick="{{ r.dec }}" style="width:34px;height:34px;border-radius:17px;display:grid;place-items:center;color:#afafaf"><span class="ms" style="font-size:18px">remove</span></button>
            <span style="min-width:74px;text-align:center;font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap">{{ r.val }}</span>
            <button onClick="{{ r.inc }}" style="width:34px;height:34px;border-radius:17px;display:grid;place-items:center;color:#afafaf"><span class="ms" style="font-size:18px">add</span></button>
          </div>
        </div>
      </sc-for>
    </section>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:900}}">
const nf = (n, d = 2) => n.toLocaleString('nb-NO', { minimumFractionDigits: d, maximumFractionDigits: d });
const DEF = { day: 0.4238, night: 0.3238, sur: 0.049, thr: 0.9375, pct: 90, vat: 25 };
const SPOT = 1.42;
class Component extends DCLogic {
  state = { ...DEF };
  renderVals() {
    const s = this.state, grid = new Date().getHours() >= 6 && new Date().getHours() < 22 ? s.day : s.night;
    const support = Math.max(0, SPOT - s.thr) * s.pct / 100, vat = 1 + s.vat / 100;
    const spotV = SPOT * vat, sup = -support * vat, surV = s.sur * vat, tot = spotV + sup + surV + grid;
    const P = [['Spot', spotV, 'rgb(115 185 242)'], ['Nettleie', grid, 'rgb(242 181 115)'], ['Påslag', surV, 'rgb(173 153 230)'], ['Strømstøtte', sup, 'rgb(102 209 158)']];
    const pos = P.filter(p => p[1] > 0).reduce((t, p) => t + p[1], 0);
    const row = (label, ent, key, step, fmt) => ({ label, ent, val: fmt(s[key]), dec: () => this.setState({ [key]: Math.max(0, +(s[key] - step).toFixed(4)) }), inc: () => this.setState({ [key]: +(s[key] + step).toFixed(4) }),
      row: { display: 'flex', alignItems: 'center', gap: 10, minHeight: 64, borderTop: '1px solid rgba(255,255,255,0.05)' } });
    const kr = v => `${nf(v, 4)} kr`;
    return {
      total: nf(tot),
      parts: P.map(([label, v, c]) => ({ label, val: `${v < 0 ? '−' : ''}${nf(Math.abs(v))}`, bar: { flex: Math.max(0.001, Math.abs(v) / pos), background: c, display: v === 0 ? 'none' : 'block' }, dot: { width: 8, height: 8, borderRadius: 4, background: c, flex: 'none' } })),
      groups: [
        { title: 'Nettleie', rows: [row('Dag · 06–22', 'input_number.grid_day_hourly_cost', 'day', 0.01, kr), row('Natt og helg', 'input_number.grid_night_hourly_cost', 'night', 0.01, kr)] },
        { title: 'Strømselskap og stat', rows: [row('Påslag', 'input_number.el_company_surcharge', 'sur', 0.005, kr), row('Strømstøtte fra', 'input_number.electricity_government_support_threshold', 'thr', 0.01, kr), row('Strømstøtte', 'input_number.electricity_government_support_percentage', 'pct', 5, v => `${v} %`), row('Mva', 'input_number.vat_percent', 'vat', 1, v => `${v} %`)] },
      ],
    };
  }
}
</script>
</body>
</html>
