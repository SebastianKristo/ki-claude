<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block" rel="stylesheet">
<style>
html,body{margin:0;background:#232323;color:#fafafa;font-family:'Space Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#fafafa}a:hover{color:rgb(242 133 201)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;line-height:1;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;user-select:none}
</style>
</helmet>
<div style="box-sizing:border-box;width:100%;max-width:420px;min-height:100vh;margin:0 auto;background:#232323;padding:20px 18px 40px;display:flex;flex-direction:column;gap:16px">
  <header style="display:flex;align-items:center;gap:12px">
    <span style="width:40px;height:40px;border-radius:20px;background:#e1e1e1;color:#232323;display:grid;place-items:center;flex:none"><span class="ms" style="font-size:22px;font-variation-settings:'FILL' 1">volunteer_activism</span></span>
    <div style="flex:1;font-size:26px;font-weight:500;letter-spacing:-0.02em">Norgespris</div>
  </header>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:4px;border-radius:22px;background:#2f2f2f">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="2"><button onPointerDown="{{ t.odown }}" onPointerMove="{{ t.omove }}" onPointerUp="{{ t.oup }}" onPointerCancel="{{ t.oup }}" onClick="{{ t.go }}" style="{{ t.style }}">{{ t.label }}</button></sc-for>
  </div>
  <section style="display:flex;flex-direction:column;gap:4px;padding:18px;border-radius:26px;background:#2f2f2f">
    <span style="font-size:12px;color:#7f7f7f">{{ hero.label }}</span>
    <span style="{{ hero.valStyle }}">{{ hero.val }}<span style="font-size:16px;color:#7f7f7f;font-weight:400"> kr</span></span>
    <span style="font-size:13px;color:#979797">{{ hero.sub }}</span>
  </section>
  <section style="display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:24px;background:#2f2f2f">
    <div style="display:flex;gap:14px;font-size:12px;color:#979797"><span style="display:flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:3px;background:rgb(242 133 201)"></span>Norgespris</span><span style="display:flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:3px;background:#545454"></span>Spot</span></div>
    <div style="display:flex;align-items:flex-end;gap:3px;height:150px">
      <sc-for list="{{ bars }}" as="b" hint-placeholder-count="12">
        <div onClick="{{ b.pick }}" style="flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;cursor:pointer">
          <div style="width:100%;flex:1;display:flex;align-items:flex-end;gap:1px"><span style="{{ b.n }}"></span><span style="{{ b.s }}"></span></div>
          <span style="{{ b.lab }}">{{ b.label }}</span>
        </div>
      </sc-for>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:13px;padding-top:4px;border-top:1px solid rgba(255,255,255,0.06)"><span style="color:#979797">{{ sel.label }}</span><span style="font-variant-numeric:tabular-nums">{{ sel.text }}</span></div>
  </section>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
    <sc-for list="{{ facts }}" as="f" hint-placeholder-count="4">
      <div style="display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:22px;background:#2f2f2f"><span style="font-size:12px;color:#7f7f7f">{{ f.label }}</span><span style="font-size:20px;font-weight:500;font-variant-numeric:tabular-nums">{{ f.val }}</span></div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:900}}">
const PINK = 'linear-gradient(145deg, rgb(242 133 201) -10%, rgb(245 205 198) 100%)';
const GREEN = 'rgb(102 209 158)', RED = 'rgb(242 128 115)';
const nf = (n, d = 0) => n.toLocaleString('nb-NO', { minimumFractionDigits: d, maximumFractionDigits: d });
const MON = ['jan', 'feb', 'mar', 'apr', 'mai', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'des'];
const YEAR = [[1240, 1890], [1120, 1610], [980, 1180], [760, 690], [610, 520], [540, 610], [520, 480], [560, 700], [690, 910], [0, 0], [0, 0], [0, 0]];
const MONTH = Array.from({ length: 26 }, (_, i) => { const kwh = 18 + ((i * 7) % 11); const spot = 0.6 + ((i * 13) % 17) / 10; return [kwh * 0.5 * 1.25 + kwh * 0.4, kwh * spot * 1.25 * 0.9 + kwh * 0.4]; });
const TABORD = (comp, key, list) => {
  const LK = 'tab-order:' + key; let ord = null; try { ord = JSON.parse(localStorage.getItem(LK) || 'null'); } catch (e) {}
  const st = comp.state.__tdrag; let L = list.map((t, i) => ({ t, k: String(t.label ?? i) }));
  if (ord) L.sort((a, b) => { const ia = ord.indexOf(a.k), ib = ord.indexOf(b.k); return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib); });
  const keys = L.map(x => x.k), mine = st && st.key === key;
  const begin = (el, k, x0) => { const sib = [...el.parentElement.children].filter(c => c.tagName === el.tagName), rects = sib.map(c => c.getBoundingClientRect()), i = sib.indexOf(el);
    window.__tabReorder = true; if (navigator.vibrate) navigator.vibrate(10); comp.setState({ __tdrag: { key, k, dx: 0 } });
    const mv = e => { e.preventDefault(); e.stopPropagation(); comp.setState({ __tdrag: { key, k, dx: e.clientX - x0 } }); };
    const fin = e => { window.removeEventListener('pointermove', mv, true); window.removeEventListener('pointerup', fin, true); window.removeEventListener('pointercancel', fin, true);
      e.stopPropagation(); setTimeout(() => { window.__tabReorder = false; }, 60);
      if (e.type === 'pointerup') { const r0 = rects[Math.max(0, i)] || rects[0], cx = r0.left + r0.width / 2 + (e.clientX - x0); let j = rects.findIndex(r => cx >= r.left && cx <= r.right); if (j < 0) j = cx < rects[0].left ? 0 : rects.length - 1;
        const a2 = keys.filter(x => x !== k); a2.splice(j, 0, k); try { localStorage.setItem(LK, JSON.stringify(a2)); } catch (x) {} }
      comp._tEat = true; setTimeout(() => { comp._tEat = false; }, 350); comp.setState({ __tdrag: null }); };
    window.addEventListener('pointermove', mv, { capture: true, passive: false }); window.addEventListener('pointerup', fin, true); window.addEventListener('pointercancel', fin, true); };
  return L.map(({ t, k }) => { const d = mine && st.k === k;
    return { ...t,
      odown: e => { const el = e.currentTarget, x0 = e.clientX, y0 = e.clientY; clearTimeout(comp._tHold); comp._tXY = [x0, y0]; comp._tHold = setTimeout(() => begin(el, k, x0), 380); },
      omove: e => { const p = comp._tXY; if (p && Math.hypot(e.clientX - p[0], e.clientY - p[1]) > 8) clearTimeout(comp._tHold); },
      oup: () => clearTimeout(comp._tHold),
      ...(t.go ? { go: e => { if (comp._tEat) return; t.go(e); } } : {}),
      style: d ? { ...t.style, position: 'relative', zIndex: 5, transform: `translateX(${st.dx}px) scale(1.06)`, boxShadow: '0 8px 20px rgba(0,0,0,0.45), inset 0 0 0 1.5px rgb(242 133 201)', transition: 'none', touchAction: 'none', WebkitTouchCallout: 'none', userSelect: 'none' }
        : mine ? { ...t.style, opacity: 0.65, transition: 'opacity .2s' } : { ...t.style, WebkitTouchCallout: 'none', userSelect: 'none' } }; });
};
class Component extends DCLogic {
  state = { tab: 'mnd', sel: null };
  __tabWrap(v) { if (v && Array.isArray(v.tabs)) v.tabs = TABORD(this, 'norgespris', v.tabs); return v; }
  renderVals() { return this.__tabWrap(this.__rv()); }
  __rv() {
    const s = this.state, yr = s.tab === 'ar', D = yr ? YEAR : MONTH, used = D.filter(x => x[0] > 0);
    const n = used.reduce((t, x) => t + x[0], 0), sp = used.reduce((t, x) => t + x[1], 0), save = sp - n, max = Math.max(...D.map(x => Math.max(x[0], x[1])));
    const lab = i => yr ? MON[i] : String(i + 1);
    const i0 = s.sel != null && s.sel < D.length ? s.sel : used.length - 1, x = D[i0];
    return {
      tabs: [['mnd', 'Måned'], ['ar', 'År']].map(([id, label]) => ({ label, go: () => this.setState({ tab: id, sel: null }), style: { height: 46, borderRadius: 18, fontSize: 15, fontWeight: 500, background: s.tab === id ? PINK : 'transparent', color: s.tab === id ? '#2a1720' : '#979797' } })),
      hero: { label: yr ? 'Spart med Norgespris i år' : 'Spart med Norgespris i september', val: `${save >= 0 ? '' : '−'}${nf(Math.abs(save))}`, sub: `Norgespris ${nf(n)} kr · Spot ville vært ${nf(sp)} kr`,
        valStyle: { fontSize: 48, fontWeight: 500, letterSpacing: '-0.03em', lineHeight: 1.05, fontVariantNumeric: 'tabular-nums', color: save >= 0 ? GREEN : RED } },
      bars: D.map((v, i) => { const on = i === i0, empty = !v[0];
        return { label: yr || i % 5 === 0 ? lab(i) : '', pick: () => !empty && this.setState({ sel: i }),
          n: { flex: 1, height: `${v[0] / max * 100}%`, minHeight: empty ? 0 : 2, borderRadius: 3, background: 'rgb(242 133 201)', opacity: on || s.sel == null ? 1 : 0.5 },
          s: { flex: 1, height: `${v[1] / max * 100}%`, minHeight: empty ? 0 : 2, borderRadius: 3, background: '#545454', opacity: on || s.sel == null ? 1 : 0.5 },
          lab: { fontSize: 10, color: on ? '#fafafa' : '#696969', height: 12 } }; }),
      sel: { label: yr ? MON[i0].replace(/^./, c => c.toUpperCase()) : `${i0 + 1}. september`, text: x ? `${nf(x[0])} kr · spot ${nf(x[1])} kr · ${x[1] - x[0] >= 0 ? 'spart' : 'tapt'} ${nf(Math.abs(x[1] - x[0]))} kr` : '' },
      facts: [['Fastpris', '50 øre/kWh'], ['Besparelse i dag', '14 kr'], ['Snitt spot', yr ? '1,12 kr' : '1,34 kr'], ['Forbruk', yr ? '9 840 kWh' : '612 kWh']].map(([label, val]) => ({ label, val })),
    };
  }
}
</script>
</body>
</html>
