<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block" rel="stylesheet">
<style>
html,body{margin:0;background:#232323;color:#fafafa;font-family:'Space Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#fafafa}a:hover{color:rgb(242 133 201)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;line-height:1;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;user-select:none}
</style>
</helmet>
<div style="box-sizing:border-box;width:100%;max-width:420px;min-height:100vh;margin:0 auto;background:#232323;padding:20px 18px 40px;display:flex;flex-direction:column;gap:16px">
  <header style="display:flex;align-items:center;gap:12px">
    <span style="width:40px;height:40px;border-radius:20px;background:#e1e1e1;color:#232323;display:grid;place-items:center;flex:none"><span class="ms" style="font-size:22px;font-variation-settings:'FILL' 1">volunteer_activism</span></span>
    <div style="flex:1;font-size:26px;font-weight:500;letter-spacing:-0.02em">Norgespris</div>
  </header>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:4px;border-radius:22px;background:#2f2f2f">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="2"><button onPointerDown="{{ t.odown }}" onPointerMove="{{ t.omove }}" onPointerUp="{{ t.oup }}" onPointerCancel="{{ t.oup }}" onClick="{{ t.go }}" style="{{ t.style }}">{{ t.label }}</button></sc-for>
  </div>
  <section style="display:flex;flex-direction:column;gap:4px;padding:18px;border-radius:26px;background:#2f2f2f">
    <span style="font-size:12px;color:#7f7f7f">{{ hero.label }}</span>
    <span style="{{ hero.valStyle }}">{{ hero.val }}<span style="font-size:16px;color:#7f7f7f;font-weight:400"> kr</span></span>
    <span style="font-size:13px;color:#979797">{{ hero.sub }}</span>
  </section>
  <section style="display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:24px;background:#2f2f2f">
    <div style="display:flex;gap:14px;font-size:12px;color:#979797"><span style="display:flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:3px;background:rgb(242 133 201)"></span>Norgespris</span><span style="display:flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:3px;background:#545454"></span>Spot</span></div>
    <div style="display:flex;align-items:flex-end;gap:3px;height:150px">
      <sc-for list="{{ bars }}" as="b" hint-placeholder-count="12">
        <div onClick="{{ b.pick }}" style="flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;cursor:pointer">
          <div style="width:100%;flex:1;display:flex;align-items:flex-end;gap:1px"><span style="{{ b.n }}"></span><span style="{{ b.s }}"></span></div>
          <span style="{{ b.lab }}">{{ b.label }}</span>
        </div>
      </sc-for>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:13px;padding-top:4px;border-top:1px solid rgba(255,255,255,0.06)"><span style="color:#979797">{{ sel.label }}</span><span style="font-variant-numeric:tabular-nums">{{ sel.text }}</span></div>
  </section>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
    <sc-for list="{{ facts }}" as="f" hint-placeholder-count="4">
      <div style="display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:22px;background:#2f2f2f"><span style="font-size:12px;color:#7f7f7f">{{ f.label }}</span><span style="font-size:20px;font-weight:500;font-variant-numeric:tabular-nums">{{ f.val }}</span></div>
    </sc-for>
  </div>
</div>
</x-dc>

      hero: { label: yr ? 'Spart med Norgespris i år' : `Spart med Norgespris i ${MNAME}`, val: `${save >= 0 ? '' : '−'}${nf(Math.abs(save))}`, sub: `Norgespris ${nf(n)} kr · Spot ville vært ${nf(sp)} kr`,
        valStyle: { fontSize: 48, fontWeight: 500, letterSpacing: '-0.03em', lineHeight: 1.05, fontVariantNumeric: 'tabular-nums', color: save >= 0 ? GREEN : RED } },
      bars: D.map((v, i) => { const on = i === i0, empty = !v[0];
        return { label: yr || i % 5 === 0 ? lab(i) : '', pick: () => !empty && this.setState({ sel: i }),
          n: { flex: 1, height: `${v[0] / max * 100}%`, minHeight: empty ? 0 : 2, borderRadius: 3, background: 'rgb(242 133 201)', opacity: on || s.sel == null ? 1 : 0.5 },
          s: { flex: 1, height: `${v[1] / max * 100}%`, minHeight: empty ? 0 : 2, borderRadius: 3, background: '#545454', opacity: on || s.sel == null ? 1 : 0.5 },
          lab: { fontSize: 10, color: on ? '#fafafa' : '#696969', height: 12 } }; }),
      sel: { label: yr ? MON[i0].replace(/^./, c => c.toUpperCase()) : `${i0 + 1}. ${MNAME}`, text: x ? `${nf(x[0])} kr · spot ${nf(x[1])} kr · ${x[1] - x[0] >= 0 ? 'spart' : 'tapt'} ${nf(Math.abs(x[1] - x[0]))} kr` : '' },
      facts: (FACTS ? [['Fastpris', FACTS.fast], ['Besparelse i dag', FACTS.idag], ['Snitt spot', yr ? FACTS.snittY : FACTS.snittM], ['Forbruk', yr ? FACTS.kwhY : FACTS.kwhM]]
        : [['Fastpris', '50 øre/kWh'], ['Besparelse i dag', '14 kr'], ['Snitt spot', yr ? '1,12 kr' : '1,34 kr'], ['Forbruk', yr ? '9 840 kWh' : '612 kWh']]).map(([label, val]) => ({ label, val })),
    };
  }
}
</script>
