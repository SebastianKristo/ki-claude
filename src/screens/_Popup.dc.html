<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block" rel="stylesheet">
<style>
html,body{margin:0;background:#232323;color:#fafafa;font-family:'Space Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#fafafa}a:hover{color:rgb(242 181 115)}
[data-snap]::-webkit-scrollbar{display:none}
@keyframes pop{from{transform:translate(-50%,-46%) scale(.9);opacity:0}}
@keyframes fadein{from{opacity:0}}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;line-height:1;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;user-select:none}
[data-sheet-scroll] header{display:none!important}
</style>
<script src="./more-info.js"></script>
<script src="./glass-drag.js"></script>
</helmet>
<!-- KI Claude: popup-ramme for Bubble Card. Toppen er kopiert uendret fra arket i «Hjem v2». -->
<div style="position:relative;box-sizing:border-box;width:100%;max-width:440px;margin:0 auto;background:#232323">
    <div style="position:sticky;top:0;left:0;right:0;z-index:3;margin-bottom:-14px;padding:8px 12px 18px;display:flex;flex-direction:column;align-items:center;gap:8px;background:linear-gradient(180deg,#232323 0,#232323 72%,rgba(20,20,22,0) 100%);pointer-events:none">
      <span style="width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,0.22)"></span>
      <sc-if value="{{ isGlassNav }}" hint-placeholder-val="{{ true }}">
      <div data-bh="pill" style="position:relative;overflow:hidden;width:100%;box-sizing:border-box;height:60px;padding:0 8px;border-radius:30px;background:rgba(38,38,41,0.82);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,0.07),0 8px 24px rgba(0,0,0,0.35);display:flex;align-items:center;gap:12px;pointer-events:auto">
        <span data-bh="sheen" style="position:absolute;top:0;bottom:0;left:0;width:60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,0.10),transparent);transform:translateX(-120%);pointer-events:none"></span>
        <span data-bh="iconwrap" style="position:relative;width:44px;height:44px;flex:none;transform-origin:center">
          <span data-bh="glow" style="position:absolute;inset:0;border-radius:22px;background:rgb(242 133 201);opacity:0;pointer-events:none"></span>
          <span data-bh="icon" style="position:relative;width:44px;height:44px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(145deg, rgb(242 133 201) -10%, rgb(245 205 198) 100%);color:#2a1720"><span data-bh="glyph" class="ms" style="font-size:22px;font-variation-settings:'FILL' 1">{{ sheetHead.icon }}</span></span>
        </span>
        <span style="position:relative;flex:1;min-width:0;display:flex;flex-direction:column;gap:1px">
          <span data-bh="title" style="font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ sheetHead.title }}</span>
          <span data-bh="sub" style="font-size:12px;color:#7f7f7f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:16px">{{ sheetHead.sub }}</span>
        </span>
        <button data-bh="close" onClick="{{ closeSheet }}" title="Lukk" style="position:relative;width:44px;height:44px;border-radius:22px;flex:none;background:rgba(255,255,255,0.08);display:grid;place-items:center" style-active="transform:scale(0.92)"><span class="ms" style="font-size:22px">close</span></button>
      </div>
      </sc-if>
      <sc-if value="{{ stdThing }}" hint-placeholder-val="{{ false }}">
        <div style="width:100%;box-sizing:border-box;height:60px;padding:0 4px 0 6px;display:flex;align-items:center;gap:14px;pointer-events:auto">
          <span style="width:44px;height:44px;border-radius:22px;flex:none;display:grid;place-items:center;background:#fafafa;color:#111"><span class="ms" style="font-size:24px;font-variation-settings:'FILL' 1">{{ sheetHead.icon }}</span></span>
          <span style="flex:1;min-width:0;font-size:30px;font-weight:500;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ sheetHead.title }}</span>
          <button onClick="{{ closeSheet }}" title="Lukk" style="width:44px;height:44px;border-radius:22px;flex:none;background:#3a3a3a;display:grid;place-items:center" style-active="transform:scale(0.92)"><span class="ms" style="font-size:22px">close</span></button>
        </div>
      </sc-if>
      <sc-if value="{{ stdRoom }}" hint-placeholder-val="{{ false }}">
        <div style="width:100%;display:flex;align-items:center;gap:10px;pointer-events:auto">
          <div style="flex:1;min-width:0;height:60px;box-sizing:border-box;padding:0 16px 0 8px;border-radius:30px;background:#3a3a3a;display:flex;align-items:center;gap:12px">
            <span style="{{ sheetHead.roomIcon }}"><span class="ms" style="font-size:24px;font-variation-settings:'FILL' 1">{{ sheetHead.icon }}</span></span>
            <span style="font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ sheetHead.title }}</span>
          </div>
          <button onClick="{{ closeSheet }}" title="Lukk" style="width:60px;height:60px;border-radius:30px;flex:none;background:#3a3a3a;display:grid;place-items:center" style-active="transform:scale(0.92)"><span class="ms" style="font-size:24px">close</span></button>
        </div>
      </sc-if>
    </div>
  <div data-sheet-scroll="1" style="padding-bottom:40px">{{ body }}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
// Samme toppfelt som arkene i «Hjem v2», men for Bubble Card-pop-ups (#ki-<nøkkel>).
const M = { strom: ['bolt', 'Strøm', 'Forbruk og priser'], sik: ['shield', 'Sikkerhet', ''], vann: ['sprinkler', 'Vanning', 'Hage og plen'], vac: ['cleaning_services', 'Støvsuger', 'Sir Sweeps'], media: ['music_note', 'Media', 'Høyttalere og TV'], car: ['directions_car', 'Bil', 'Tesla Model Y'], server: ['dns', 'Server', 'Nettverk · HA · Proxmox'], settings: ['tune', 'Innstillinger', 'Dashbord'], cal: ['calendar_month', 'Kalender', 'Familie og skole'], person: ['person', 'Tilstedeværelse', 'Mobil, sone og søvn'], vaer: ['partly_cloudy_day', 'Vær', ''], lys: ['lightbulb', 'Lys', 'Alle rom'], cam: ['videocam', 'Kamera', ''], klima: ['thermostat', 'Klima', 'Energimotoren'], trash: ['delete', 'Søppel', 'Tømmeplan'], todo: ['checklist', 'Gjøremål', 'Store og personlige'], plants: ['potted_plant', 'Planter', 'Jordfukt og vanning'], sleep: ['bedtime', 'Søvn', 'Søvn og vekking'], printer: ['print', '3D-printer', ''], pool: ['pool', 'Basseng', 'Vann og pumpe'], mower: ['grass', 'Gressklipper', ''], nibe: ['heat_pump', 'Varmepumpe', ''], bill: ['receipt_long', 'Strømregning', 'Estimat og effekttrinn'], doors: ['lock', 'Dører og porter', 'Låser og garasjeporter'], fuel: ['local_gas_station', 'Bensinstasjon', 'Drivstoffpriser'], ruter: ['tram', 'Ruter', 'Avganger og avvik'], pcs: ['computer', 'Datamaskiner', ''], helse: ['ecg_heart', 'Helse', 'Apple Helse'], norgespris: ['volunteer_activism', 'Norgespris', 'Besparelse mot spot'], elset: ['settings_power', 'Strøminnstillinger', 'Nettleie, påslag og støtte'], jul: ['park', 'Jul', 'Julelys og automasjon'] };
const fmt = v => typeof v === 'number' && !Number.isInteger(v) ? v.toLocaleString('nb-NO', { maximumFractionDigits: 1 }) : v;
class Component extends DCLogic {
  renderVals() {
    const key = this.props.popup || '', rom = key === 'rom' || key.startsWith('rom-');
    let look = {}; if (rom) { try { const r = JSON.parse(sessionStorage.getItem('ki-claude-rom') || '{}'); if (r.id === this.props.roomId) look = r; } catch (e) {} }
    const p = { ...look, ...this.props };
    let glass = false; try { glass = localStorage.getItem('hjem-nav') === 'glass'; } catch (e) {}
    const [icon, title, sub0] = rom ? [p.icon || 'meeting_room', p.name || 'Rom', ''] : M[key] || [p.icon || 'home', p.title || key, ''];
    let sub = p.sub ?? sub0;
    if (key === 'sik' && !p.sub) { const al = ha.first('alarm', ...ha.domain('alarm_control_panel')); sub = al ? (/^armed/.test(ha.val(al, '')) ? 'Alarm armert' : 'Alarm av') : ''; }
    if (key === 'vaer' && !p.sub) sub = (ha.hass && ha.hass.config && ha.hass.config.location_name) || '';
    if (rom && !p.sub && p.temp != null) sub = `${fmt(p.temp)}° · ${p.hum ?? '–'} %`;
    return {
      isGlassNav: glass, stdThing: !glass && !rom, stdRoom: !glass && rom,
      sheetHead: { icon, title, sub, roomIcon: { width: 44, height: 44, borderRadius: 22, flex: 'none', display: 'grid', placeItems: 'center', background: p.col || '#fafafa', color: '#111' } },
      closeSheet: () => ha.closePopup(),
    };
  }
}
</script>
</body>
</html>
