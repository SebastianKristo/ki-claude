<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block" rel="stylesheet">
<style>
html,body{margin:0;background:#232323;color:#fafafa;font-family:'Space Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#fafafa}a:hover{color:rgb(102 209 158)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;line-height:1;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;user-select:none}
</style>
</helmet>
<div style="box-sizing:border-box;width:100%;max-width:420px;min-height:100vh;margin:0 auto;background:#232323;padding:20px 18px 40px;display:flex;flex-direction:column;gap:22px">
  <header style="display:flex;align-items:center;justify-content:space-between">
    <div style="font-size:13px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:#7f7f7f">Planter</div>
    <button style="width:36px;height:36px;border-radius:18px;background:#3a3a3a;display:grid;place-items:center"><span class="ms" style="font-size:20px">close</span></button>
  </header>

  <section style="display:flex;flex-direction:column;gap:6px;padding:0 4px">
    <div style="{{ statusStyle }}"><span style="{{ statusDot }}"></span>{{ status }}</div>
    <div style="font-size:24px;font-weight:500;letter-spacing:-0.015em">{{ headline }}</div>
    <div style="font-size:14px;color:#7f7f7f">{{ sub }}</div>
  </section>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:4px;border-radius:20px;background:#2f2f2f">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="2"><button onPointerDown="{{ t.odown }}" onPointerMove="{{ t.omove }}" onPointerUp="{{ t.oup }}" onPointerCancel="{{ t.oup }}" onClick="{{ t.go }}" style="{{ t.style }}">{{ t.label }}</button></sc-for>
  </div>

  <sc-if value="{{ hasPlaces }}" hint-placeholder-val="{{ false }}">
    <section style="display:flex;flex-direction:column;gap:8px">
      <sc-for list="{{ places }}" as="s" hint-placeholder-count="2">
        <div style="display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;border-radius:24px;background:#2f2f2f">
          <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
            <span style="font-size:15px;font-weight:500">{{ s.name }}</span>
            <span style="font-size:12px;color:#7f7f7f">{{ s.sub }}</span>
          </div>
          <button onClick="{{ s.water }}" style="{{ s.btn }}"><span class="ms" style="font-size:18px;font-variation-settings:'FILL' 1">water_drop</span>Alle vannet</button>
        </div>
      </sc-for>
    </section>
  </sc-if>

  <section style="display:flex;flex-direction:column;gap:8px">
    <sc-for list="{{ plants }}" as="p" hint-placeholder-count="2">
      <div style="display:flex;flex-direction:column;gap:14px;padding:16px;border-radius:24px;background:#2f2f2f">
        <div style="display:flex;align-items:center;gap:12px">
          <span style="{{ p.iconWrap }}"><span class="ms" style="font-size:24px;font-variation-settings:'FILL' 1">potted_plant</span></span>
          <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
            <span style="font-size:15px;font-weight:500">{{ p.name }}</span>
            <span style="font-size:12px;color:#7f7f7f;font-style:italic">{{ p.latin }}</span>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px">
            <span style="{{ p.dueStyle }}">{{ p.due }}</span>
            <span style="font-size:11px;color:#696969">{{ p.last }}</span>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px">
          <div style="display:flex;justify-content:space-between;font-size:12px;color:#7f7f7f"><span>{{ p.barLabel }}</span><span style="font-variant-numeric:tabular-nums">{{ p.moistText }}</span></div>
          <div style="position:relative;height:8px;border-radius:4px;background:#3a3a3a">
            <span style="{{ p.band }}"></span>
            <span style="{{ p.moistBar }}"></span>
          </div>
        </div>
        <sc-if value="{{ p.adv }}" hint-placeholder-val="{{ false }}">
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">
            <sc-for list="{{ p.metrics }}" as="m" hint-placeholder-count="3">
              <div style="display:flex;flex-direction:column;gap:3px;padding:10px 12px;border-radius:14px;background:#232323">
                <span style="display:flex;align-items:center;gap:4px;font-size:11px;color:#7f7f7f;white-space:nowrap"><span class="ms" style="font-size:14px">{{ m.icon }}</span>{{ m.label }}</span>
                <span style="font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap">{{ m.v }}</span>
              </div>
            </sc-for>
          </div>
        </sc-if>
        <button onClick="{{ p.water }}" style="{{ p.btn }}"><span class="ms" style="font-size:18px;font-variation-settings:'FILL' 1">water_drop</span>{{ p.btnLabel }}</button>
      </div>
    </sc-for>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:1000}}">
const GREEN = 'rgb(102 209 158)', AMBER = 'rgb(242 181 115)', BLUE = 'rgb(115 185 242)';
const a = (c, o) => c.replace(')', ` / ${o})`);
const PINK = 'linear-gradient(145deg, rgb(242 133 201) -10%, rgb(245 205 198) 100%)';
const TABORD = (comp, key, list) => {
  const LK = 'tab-order:' + key; let ord = null; try { ord = JSON.parse(localStorage.getItem(LK) || 'null'); } catch (e) {}
  const st = comp.state.__tdrag; let L = list.map((t, i) => ({ t, k: String(t.label ?? i) }));
  if (ord) L.sort((a, b) => { const ia = ord.indexOf(a.k), ib = ord.indexOf(b.k); return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib); });
  const keys = L.map(x => x.k), mine = st && st.key === key;
  const begin = (el, k, x0) => { const sib = [...el.parentElement.children].filter(c => c.tagName === el.tagName), rects = sib.map(c => c.getBoundingClientRect()), i = sib.indexOf(el);
    window.__tabReorder = true; if (navigator.vibrate) navigator.vibrate(10); comp.setState({ __tdrag: { key, k, dx: 0 } });
    const mv = e => { e.preventDefault(); e.stopPropagation(); comp.setState({ __tdrag: { key, k, dx: e.clientX - x0 } }); };
    const fin = e => { window.removeEventListener('pointermove', mv, true); window.removeEventListener('pointerup', fin, true); window.removeEventListener('pointercancel', fin, true);
      e.stopPropagation(); setTimeout(() => { window.__tabReorder = false; }, 60);
      if (e.type === 'pointerup') { const r0 = rects[Math.max(0, i)] || rects[0], cx = r0.left + r0.width / 2 + (e.clientX - x0); let j = rects.findIndex(r => cx >= r.left && cx <= r.right); if (j < 0) j = cx < rects[0].left ? 0 : rects.length - 1;
        const a2 = keys.filter(x => x !== k); a2.splice(j, 0, k); try { localStorage.setItem(LK, JSON.stringify(a2)); } catch (x) {} }
      comp._tEat = true; setTimeout(() => { comp._tEat = false; }, 350); comp.setState({ __tdrag: null }); };
    window.addEventListener('pointermove', mv, { capture: true, passive: false }); window.addEventListener('pointerup', fin, true); window.addEventListener('pointercancel', fin, true); };
  return L.map(({ t, k }) => { const d = mine && st.k === k;
    return { ...t,
      odown: e => { const el = e.currentTarget, x0 = e.clientX, y0 = e.clientY; clearTimeout(comp._tHold); comp._tXY = [x0, y0]; comp._tHold = setTimeout(() => begin(el, k, x0), 380); },
      omove: e => { const p = comp._tXY; if (p && Math.hypot(e.clientX - p[0], e.clientY - p[1]) > 8) clearTimeout(comp._tHold); },
      oup: () => clearTimeout(comp._tHold),
      ...(t.go ? { go: e => { if (comp._tEat) return; t.go(e); } } : {}),
      style: d ? { ...t.style, position: 'relative', zIndex: 5, transform: `translateX(${st.dx}px) scale(1.06)`, boxShadow: '0 8px 20px rgba(0,0,0,0.45), inset 0 0 0 1.5px rgb(242 133 201)', transition: 'none', touchAction: 'none', WebkitTouchCallout: 'none', userSelect: 'none' }
        : mine ? { ...t.style, opacity: 0.65, transition: 'opacity .2s' } : { ...t.style, WebkitTouchCallout: 'none', userSelect: 'none' } }; });
};
// ── Live-kobling: KI Planter (ki_planter) ──────────────────────────────────
// Planter = binary_sensor.<plante>_trenger_vann (attr integrasjon: ki_planter, type: plante),
// steder = sensor.<sted>_planter_trenger_vann (type: sted). Uten integrasjonen vises demo uendret.
const SEASON = { vinter: 'Vintersesong', vekst: 'Vekstsesong', 'høysommer': 'Høysommer' };
const nf1 = n => Number(n).toLocaleString('nb-NO', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const nfi = n => Math.round(Number(n)).toLocaleString('nb-NO');
const siblings = (id, domain) => {
  const ents = ha.hass?.entities || {}, dev = ents[id]?.device_id;
  return dev ? Object.keys(ents).filter(e => ents[e].device_id === dev && e !== id && (!domain || e.startsWith(domain + '.'))) : [];
};
function plantEnt(id, domain, suffix) {
  // plante-entiteter deler enhet; faller tilbake til standard entity_id-mønster
  const sib = siblings(id, domain).find(e => e.endsWith('_' + suffix));
  return sib || ha.first(null, `${domain}.${id.split('.')[1].replace(/_trenger_vann$/, '')}_${suffix}`);
}
function sensorExtras(moistId) {
  // lys/temperatur/næring fra samme fysiske sensor (f.eks. Mi Flora), om den finnes
  const out = {};
  if (!moistId) return out;
  siblings(moistId, 'sensor').forEach(e => {
    const st = ha.state(e); if (!st) return;
    const dc = st.attributes.device_class, u = st.attributes.unit_of_measurement || '', v = ha.num(e, null);
    if (v == null) return;
    if (dc === 'illuminance' || u === 'lx') out.lux = `${nfi(v)} lx`;
    else if (dc === 'temperature') out.temp = `${nf1(v)}°`;
    else if (dc === 'conductivity' || /S\/cm|µS/.test(u) || /conductivity|ledningsevne|naering/.test(e)) out.ec = `${nfi(v)} µS`;
  });
  return out;
}
function loadLive() {
  const ids = ha.ki('ki_planter', a => a.type === 'plante').filter(id => id.startsWith('binary_sensor.'));
  if (!ids.length) return null;
  const placeIds = ha.ki('ki_planter', a => a.type === 'sted');
  const plants = ids.map(id => {
    const A = ha.state(id).attributes || {};
    const moist = typeof A.fuktighet === 'number' ? Math.round(A.fuktighet) : null;
    const lo = typeof A.fuktighet_min === 'number' ? Math.round(A.fuktighet_min) : null;
    const need = ha.val(id) === 'on';
    const every = A.intervall_dager, days = A.dager_siden, left = A.dager_igjen;
    const wet = !need && /^Fuktig/.test(A.status || '');
    const x = sensorExtras(A.fuktighet_sensor);
    return { id, name: A.navn || ha.name(id, id), latin: A.latin || '', sted: A.sted || '', moist, lo, need, wet, every, days, left, status: A.status || '', A, x,
      water: plantEnt(id, 'button', 'vannet_na') };
  }).sort((p, q) => p.sted.localeCompare(q.sted, 'nb') || p.name.localeCompare(q.name, 'nb'));
  const places = placeIds.map(id => { const A = ha.state(id).attributes || {}; return { id, name: A.sted || ha.name(id, id), all: (A.planter || []).length, need: ha.num(id, (A.trenger_vann || []).length),
    btn: ha.first(null, `button.${A.prefix || id.split('.')[1].replace(/_trenger_vann$/, '')}_alle_vannet`) || siblings(id, 'button').find(e => e.endsWith('_alle_vannet')), A }; });
  const P0 = ha.state(placeIds[0])?.attributes || plants[0].A;
  return { plants, places, season: P0.sesong, daylen: P0.daglengde_timer };
}
class Component extends DCLogic {
  state = { tab: 'enkel', plants: [
    { name: 'Arekapalme', latin: 'Dypsis lutescens', moist: 41, lo: 35, hi: 60, every: 7, days: 4, lux: '2 400 lx', temp: '21,4°', ec: '640 µS' },
    { name: 'Palmelilje', latin: 'Yucca elephantipes', moist: 53, lo: 20, hi: 45, every: 16, days: 16, lux: '3 100 lx', temp: '22,1°', ec: '410 µS' },
    { name: 'Monstera', latin: 'Monstera deliciosa', moist: 22, lo: 30, hi: 55, every: 8, days: 9, lux: '1 800 lx', temp: '21,0°', ec: '520 µS' },
  ] };
  __tabWrap(v) { if (v && Array.isArray(v.tabs)) v.tabs = TABORD(this, 'planter', v.tabs); return v; }
  renderVals() { const L = loadLive(); return this.__tabWrap(L ? this.__live(L) : this.__rv()); }
  __rv() {
    const s = this.state;
    const info = p => { const left = p.every - p.days; return { left, dry: p.moist < p.lo, wet: p.moist > p.hi }; };
    const all = s.plants.map(info);
    const dry = all.filter(x => x.dry || x.left <= 0).length;
    const next = Math.min(...all.map(x => x.left));
    const col = dry ? AMBER : GREEN;
    return {
      status: dry ? `${dry} trenger vann` : 'Alt i orden', statusStyle: { display: 'flex', alignItems: 'center', gap: 8, fontSize: 13, fontWeight: 500, color: '#afafaf' },
      statusDot: { width: 8, height: 8, borderRadius: 4, background: col, boxShadow: `0 0 10px ${col}` },
      headline: next <= 0 ? 'Vann i dag' : next === 1 ? 'Neste vanning i morgen' : `Neste vanning om ${next} dager`, count: s.plants.length,
      sub: `Vekstsesong · 11,8 t dagslys · ${s.plants.length} planter`, hasPlaces: false, places: [],
      tabs: [['enkel', 'Enkel'], ['avansert', 'Avansert']].map(([k, label]) => ({ label, go: () => this.setState({ tab: k }), style: { height: 40, borderRadius: 16, fontSize: 13, fontWeight: 500, background: s.tab === k ? PINK : 'transparent', color: s.tab === k ? '#2a1720' : '#979797' } })),
      plants: s.plants.map((p, i) => { const f = info(p), need = f.dry || f.left <= 0; return {
        name: p.name, latin: p.latin, moist: p.moist, range: `${p.lo}–${p.hi} %`, adv: s.tab === 'avansert',
        barLabel: 'Jordfukt', moistText: `${p.moist} % · mål ${p.lo}–${p.hi} %`,
        due: need ? 'Trenger vann' : f.wet ? `Fuktig ${p.moist} %` : `Om ${f.left} dager`, last: p.days === 0 ? 'Vannet i dag' : `Vannet for ${p.days} d siden`,
        dueStyle: { fontSize: 13, fontWeight: 600, color: need ? AMBER : f.wet ? BLUE : '#fafafa', whiteSpace: 'nowrap' },
        iconWrap: { width: 44, height: 44, borderRadius: 22, flex: 'none', display: 'grid', placeItems: 'center', background: a(need ? AMBER : GREEN, 0.16), color: need ? AMBER : GREEN },
        band: { position: 'absolute', top: 0, bottom: 0, left: `${p.lo}%`, width: `${p.hi - p.lo}%`, background: a(GREEN, 0.18), borderRadius: 4 },
        moistBar: { position: 'absolute', top: 0, bottom: 0, left: 0, width: `${p.moist}%`, borderRadius: 4, background: need ? AMBER : f.wet ? BLUE : GREEN, transition: 'width .6s' },
        metrics: [['light_mode', 'Lys', p.lux], ['thermostat', 'Temp', p.temp], ['science', 'Næring', p.ec]].map(([icon, label, v]) => ({ icon, label, v })),
        water: () => this.setState(st => ({ plants: st.plants.map((x, j) => j === i ? { ...x, moist: Math.min(95, Math.round((x.lo + x.hi) / 2 + 8)), days: 0 } : x) })),
        btnLabel: p.days === 0 ? 'Vannet i dag' : 'Merk som vannet',
        btn: { height: 44, borderRadius: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6, fontSize: 13, fontWeight: 600, background: need ? a(BLUE, 0.9) : '#3a3a3a', color: need ? '#232323' : '#afafaf' } }; }),
    };
  }
  __live(L) {
    const s = this.state, P = L.plants;
    const dry = P.filter(p => p.need).length;
    const lefts = P.map(p => p.need ? 0 : p.left).filter(v => typeof v === 'number');
    const next = lefts.length ? Math.min(...lefts) : null;
    const col = dry ? AMBER : GREEN;
    const multi = new Set(P.map(p => p.sted)).size > 1 || L.places.length > 1;
    const dayTxt = n => n === 1 ? '1 dag' : `${n} dager`;
    const nextTxt = iso => { if (!iso) return '–'; const d = new Date(iso); return isNaN(d) ? '–' : d.toLocaleDateString('nb-NO', { day: 'numeric', month: 'short' }); };
    const sub = [SEASON[L.season] || 'Sesong ukjent', L.daylen != null ? `${nf1(L.daylen)} t dagslys` : null, `${P.length} ${P.length === 1 ? 'plante' : 'planter'}`].filter(Boolean).join(' · ');
    return {
      status: dry ? `${dry} trenger vann` : 'Alt i orden', statusStyle: { display: 'flex', alignItems: 'center', gap: 8, fontSize: 13, fontWeight: 500, color: '#afafaf' },
      statusDot: { width: 8, height: 8, borderRadius: 4, background: col, boxShadow: `0 0 10px ${col}` },
      headline: next == null ? 'Ikke vannet ennå' : next <= 0 ? 'Vann i dag' : next === 1 ? 'Neste vanning i morgen' : `Neste vanning om ${next} dager`, count: P.length, sub,
      hasPlaces: multi, places: L.places.map(pl => ({ name: pl.name, sub: pl.need ? `${pl.need} av ${pl.all} trenger vann` : `${pl.all} ${pl.all === 1 ? 'plante' : 'planter'} · alt i orden`,
        water: () => pl.btn && ha.press(pl.btn),
        btn: { height: 40, padding: '0 14px', borderRadius: 20, display: 'flex', alignItems: 'center', gap: 6, fontSize: 13, fontWeight: 600, flex: 'none', background: pl.need ? a(BLUE, 0.9) : '#3a3a3a', color: pl.need ? '#232323' : '#afafaf', opacity: pl.btn ? 1 : 0.5 } })),
      tabs: [['enkel', 'Enkel'], ['avansert', 'Avansert']].map(([k, label]) => ({ label, go: () => this.setState({ tab: k }), style: { height: 40, borderRadius: 16, fontSize: 13, fontWeight: 500, background: s.tab === k ? PINK : 'transparent', color: s.tab === k ? '#2a1720' : '#979797' } })),
      plants: P.map(p => {
        const need = p.need, wet = p.wet, hasM = p.moist != null;
        const lo = p.lo ?? 0, left = p.left;
        const elapsed = typeof p.A.prosent === 'number' ? p.A.prosent : null;
        const due = need ? 'Trenger vann' : wet ? `Fuktig ${p.moist} %` : left == null ? (p.status || 'Ikke vannet ennå') : left <= 0 ? 'Vann i dag' : left === 1 ? 'I morgen' : `Om ${left} dager`;
        const x = p.x;
        const metrics = [x.lux ? ['light_mode', 'Lys', x.lux] : ['event_repeat', 'Intervall', p.every != null ? `${nf1(p.every).replace(',0', '')} d` : '–'],
          x.temp ? ['thermostat', 'Temp', x.temp] : ['eco', 'Sesong', SEASON[p.A.sesong] ? SEASON[p.A.sesong].replace('sesong', '') : '–'],
          x.ec ? ['science', 'Næring', x.ec] : ['event', 'Neste', nextTxt(p.A.neste_vanning)]];
        return {
          name: p.name, latin: multi && p.sted ? [p.latin, p.sted].filter(Boolean).join(' · ') : p.latin, adv: s.tab === 'avansert',
          barLabel: hasM ? 'Jordfukt' : 'Siden vanning',
          moistText: hasM ? (p.lo != null ? `${p.moist} % · min ${p.lo} %` : `${p.moist} %`) : p.days != null && p.every != null ? `${dayTxt(p.days)} av ${nf1(p.every).replace(',0', '')}` : p.status || '–',
          due, last: p.days == null ? 'Ikke vannet ennå' : p.days === 0 ? 'Vannet i dag' : `Vannet for ${p.days} d siden`,
          dueStyle: { fontSize: 13, fontWeight: 600, color: need ? AMBER : wet ? BLUE : '#fafafa', whiteSpace: 'nowrap' },
          iconWrap: { width: 44, height: 44, borderRadius: 22, flex: 'none', display: 'grid', placeItems: 'center', background: a(need ? AMBER : GREEN, 0.16), color: need ? AMBER : GREEN },
          band: hasM && p.lo != null ? { position: 'absolute', top: 0, bottom: 0, left: `${lo}%`, width: `${100 - lo}%`, background: a(GREEN, 0.18), borderRadius: 4 } : { display: 'none' },
          moistBar: { position: 'absolute', top: 0, bottom: 0, left: 0, width: `${Math.max(0, Math.min(100, hasM ? p.moist : elapsed != null ? elapsed : 0))}%`, borderRadius: 4, background: need ? AMBER : wet ? BLUE : GREEN, transition: 'width .6s' },
          metrics: metrics.map(([icon, label, v]) => ({ icon, label, v })),
          water: () => p.water ? ha.press(p.water) : ha.moreInfo(p.id),
          btnLabel: p.days === 0 ? 'Vannet i dag' : 'Merk som vannet',
          btn: { height: 44, borderRadius: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6, fontSize: 13, fontWeight: 600, background: need ? a(BLUE, 0.9) : '#3a3a3a', color: need ? '#232323' : '#afafaf' } };
      }),
    };
  }
}
</script>
</body>
</html>
